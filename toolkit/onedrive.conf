# OneDrive for Disk imaging (onedrive.py): Ash's app registration in Data
# Dynamics' Entra ID - Application (client) ID and Directory (tenant) ID.
# Identifiers, not secrets: the app is a public client (device code sign-in),
# there is no client secret anywhere.
# Left empty, OneDrive is offered only when the boot stick holds a file
# onedrive.config with the same two lines (no rebuild needed).
CLIENT_ID=
TENANT_ID=
